<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      background-image: url("/imgs/back.jpg");
      background-size: cover;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      opacity: 80%;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      color: #333;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #666;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e1e5e9;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #99a24b;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #ead866 0%, #a69946 100%);
      color: white;
      border: black;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .sign-up {
      width: 100%;
      margin-top: 10px;
      padding: 0.75rem;
      background: linear-gradient(135deg, #ead866 0%, #a69946 100%);
      color: white;
      border: black;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      text-underline: none;
      text-underline-style: none;
      align-content: center;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .alert {
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .home-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .home-link a {
      color: #000000;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .home-link a:hover {
      text-decoration: underline;
    }

    .demo-info {
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 5px;
      margin-bottom: 1.5rem;
      font-size: 0.5rem;
      color: #6c757d;
    }

    .demo-info strong {
      color: #495057;
    }
    .sign-up-form{
      width: 100%;
      max-width: 400px;
      align-content: center;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <h1>로그인</h1>
  </div>

  <!-- 에러 메시지 -->
  <div th:if="${error}" class="alert alert-error">
    <span th:text="${error}">로그인 오류</span>
  </div>

  <!-- 성공 메시지 -->
  <div th:if="${message}" class="alert alert-success">
    <span th:text="${message}">메시지</span>
  </div>

  <!-- 데모 계정 정보 -->
  <div class="demo-info">
    관리자: shifty / 1234<br>
    일반사용자: user / 1234
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">ID</label>
      <input type="text"
             id="username"
             name="username"
             required
             placeholder="ID를 입력하세요"
             autofocus>
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password"
             id="password"
             name="password"
             required
             placeholder="비밀번호를 입력하세요">
    </div>

    <button type="submit" class="login-btn">로그인</button>

  </form>
  <div class="sign-up-form">
    <button type="button" class="sign-up" th:onclick="|location.href='@{/signup}'|"> 회원가입 </button>
  </div>

  <div class="home-link">
    <a th:href="@{/}">홈으로 돌아가기</a>
  </div>
</div>
</body>
</html>
